name: Build

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      # BEGIN GENERATED BUILD INPUTS
      device:
        description: Device
        type: choice
        options:
          - nanopi-neo2-black
          - nanopi-r28s
          - x86-64
        default: nanopi-neo2-black
        required: true
      branch:
        description: OpenWrt branch or stable tag
        type: choice
        options:
          - main
          - v25.12.6
          - v25.12.5
          - v25.12.4
          - v25.12.3
          - v25.12.2
          - custom
        default: main
        required: true
      # END GENERATED BUILD INPUTS
      custom_branch:
        description: OpenWrt branch or tag when custom is selected
        type: string
        required: false
      mode:
        description: Full firmware or kernel and device packages only
        type: choice
        options:
          - full
          - preflight
        default: full

permissions:
  contents: write

jobs:
  build:
    name: ${{ github.event.client_payload.device || inputs.device }} / ${{ github.event.client_payload.branch || (inputs.branch == 'custom' && inputs.custom_branch) || inputs.branch }}
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'rexac'
    env:
      DEVICE: ${{ github.event.client_payload.device || inputs.device }}
      BRANCH: ${{ github.event.client_payload.branch || (inputs.branch == 'custom' && inputs.custom_branch) || inputs.branch }}
      BUILD_MODE: ${{ github.event.client_payload.mode || inputs.mode || 'full' }}
      OPENWRTROOT: ${{ github.workspace }}/work/openwrt
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - name: Validate build request and project
        run: |
          case "$BUILD_MODE" in full|preflight) ;; *) echo 'Invalid build mode' >&2; exit 1 ;; esac
          if [[ "$BRANCH" == custom ]]; then echo 'Enter an OpenWrt branch or tag for custom selection' >&2; exit 1; fi
          ./rexwrt plan
          ./rexwrt check
      - name: Install build dependencies
        run: bash ci/setup.sh
      - name: Combine disks
        uses: easimon/maximize-build-space@master
        with:
          # Mount only build output; mounting the workspace hides the checkout.
          build-mount-path: ${{ github.workspace }}/work
          swap-size-mb: 1024
          temp-reserve-mb: 100
          # Docker storage is mounted on the build volume below.
          root-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Place Docker storage on build volume
        run: bash ci/prepare-docker-storage.sh
      - name: Clone OpenWrt
        run: ./rexwrt clone
      - name: Install feeds
        run: ./rexwrt feeds
      - name: Configure firmware
        run: ./rexwrt configure
      - name: Restore compiler cache
        id: ccache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.OPENWRTROOT }}/.ccache
          key: ccache-v1-${{ runner.os }}-${{ env.DEVICE }}-${{ env.BRANCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ env.DEVICE }}-${{ env.BRANCH }}-
      - name: Compile kernel and device packages first
        run: ./rexwrt preflight
      - name: Download sources
        if: env.BUILD_MODE == 'full'
        run: ./rexwrt download
      - name: Compile firmware
        if: env.BUILD_MODE == 'full'
        id: compile
        continue-on-error: true
        run: ./rexwrt compile
      - name: Retry compilation with verbose logs
        id: compile_retry
        if: ${{ !cancelled() && steps.compile.outcome == 'failure' }}
        env:
          V: s
        run: ./rexwrt compile --jobs 1
      - name: Generate and collect images
        id: images
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile_retry.outcome == 'success') }}
        continue-on-error: true
        run: ./rexwrt images
      - name: Retry image generation with verbose logs
        if: ${{ !cancelled() && steps.images.outcome == 'failure' }}
        env:
          V: s
        run: ./rexwrt images --jobs 1
      # Preserve useful compiler results even when a later compilation fails.
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache_restore.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.OPENWRTROOT }}/.ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}
      - name: Prepare release
        if: env.FIRMWARE != ''
        id: release
        run: |
          echo "tag=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          printf 'Default LAN IP: 192.168.5.1 on NanoPi R28S; 10.0.0.1 on other devices.\n' > release.txt
      - name: Publish firmware
        if: env.FIRMWARE != ''
        uses: softprops/action-gh-release@v2.6.1
        with:
          name: ${{ steps.release.outputs.tag }} Automatic Release
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
      - name: Retain recent releases
        if: env.FIRMWARE != ''
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 20
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
