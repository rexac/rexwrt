name: Build

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      device:
        description: Device name (see ./rexwrt devices)
        default: nanopi-neo2-black
        required: true
      branch:
        description: OpenWrt branch or stable tag
        default: main
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ github.event.client_payload.device || inputs.device }} / ${{ github.event.client_payload.branch || inputs.branch }}
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'rexac'
    env:
      DEVICE: ${{ github.event.client_payload.device || inputs.device }}
      BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
      OPENWRTROOT: ${{ github.workspace }}/work/openwrt
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - name: Validate build request and project
        run: |
          ./rexwrt plan
          ./rexwrt check
      - name: Install build dependencies
        run: bash ci/setup.sh
      - name: Combine disks
        uses: easimon/maximize-build-space@master
        with:
          # Mount only build output; mounting the workspace hides the checkout.
          build-mount-path: ${{ github.workspace }}/work
          swap-size-mb: 1024
          temp-reserve-mb: 100
          # Docker storage is mounted on the build volume below.
          root-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Place Docker storage on build volume
        run: bash ci/prepare-docker-storage.sh
      - name: Clone OpenWrt
        run: ./rexwrt clone
      - name: Install feeds
        run: ./rexwrt feeds
      - name: Configure firmware
        run: ./rexwrt configure
      - name: Download sources
        run: ./rexwrt download
      - name: Compile firmware
        id: compile
        continue-on-error: true
        run: ./rexwrt compile
      - name: Generate and collect images
        id: images
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: ./rexwrt images
      - name: Diagnose build failure
        if: ${{ !cancelled() && (steps.compile.outcome == 'failure' || steps.images.outcome == 'failure') }}
        run: |
          cd "$OPENWRTROOT"
          make -j1 V=s || true
          exit 1
      - name: Prepare release
        if: env.FIRMWARE != ''
        id: release
        run: |
          echo "tag=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          printf 'Default IP: 10.0.0.1\n' > release.txt
      - name: Publish firmware
        if: env.FIRMWARE != ''
        uses: softprops/action-gh-release@v2.6.1
        with:
          name: ${{ steps.release.outputs.tag }} Automatic Release
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
      - name: Retain recent releases
        if: env.FIRMWARE != ''
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 20
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
