name: Repo Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
      branches: ${{ steps.matrix.outputs.branches }}
    steps:
      - uses: actions/checkout@v6
      - name: Read devices and latest stable tag
        id: matrix
        run: |
          echo "devices=$(./rexwrt devices --json)" >> "$GITHUB_OUTPUT"
          tags=$(curl -fLSs --retry 3 'https://api.github.com/repos/openwrt/openwrt/tags?per_page=100')
          stable=$(jq -er '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last' <<< "$tags")
          echo "branches=$(jq -cn --arg stable "$stable" '["main", $stable]')" >> "$GITHUB_OUTPUT"
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}
        branch: ${{ fromJson(needs.matrix.outputs.branches) }}
    steps:
      - name: Trigger build
        env:
          DEVICE: ${{ matrix.device }}
          BRANCH: ${{ matrix.branch }}
          DISPATCH_TOKEN: ${{ secrets.SEC_TOKEN }}
        run: |
          body=$(jq -cn --arg device "$DEVICE" --arg branch "$BRANCH" \
            '{event_type: ("Build " + $device + " / " + $branch), client_payload: {device: $device, branch: $branch}}')
          curl -fLSs --retry 3 -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            --data "$body"
